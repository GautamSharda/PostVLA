env_type: so100_mujoco

total_num_envs: null

auto_reset: False
ignore_terminations: False
use_rel_reward: False
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 480
max_episode_steps: 480

video_cfg:
  save_video: False
  info_on_video: True
  fps: 30
  extra_info_on_video:
    - on_pad
    - pad_center_3cm_lift
    - cube_target_xy_distance
    - max_cube_z
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

flashact_demo_root: "${oc.env:POSTVLA_ROOT}/sim"
prompt: "pick up the cube and place it on the pink pad"
cube_xy_manifest: "${oc.env:POSTVLA_ROOT}/configs/manifests/cubevar_contact_40.json"
cube_xy_limit: 40

obs_width: 224
obs_height: 224
render_width: 640
render_height: 480
policy_camera: "exterior_left"
wrist_camera: "wrist_left"

control_fps: 30
render_fps: 30
steps_per_control: null
reset_warmup_frames: 0
reset_warmup_steps: null

on_pad_half_extent: 0.139
pad_center_threshold: 0.03
lift_z_threshold: 0.13
cube_rest_z_threshold: 0.065

grasp_reward: 0.03
lift_reward: 0.10
progress_reward_scale: 0.50
on_pad_reward: 1.0
pad_center_reward: 0.5
