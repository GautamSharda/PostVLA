defaults:
  - env/so100_mujoco_pick_place@env.train
  - env/so100_mujoco_pick_place@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "${oc.env:POSTVLA_ARTIFACT_ROOT}/rlinf_runs"
    project_name: flashact
    experiment_name: "so100_mujoco_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 1000
  max_steps: 8000
  only_eval: False
  val_check_interval: 10
  save_interval: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 5

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"

  bootstrap_type: always
  kl_beta: 0.0
  entropy_bonus: 0.005
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 16
    auto_reset: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: ${algorithm.group_size}

  eval:
    rollout_epoch: 1
    total_num_envs: 20
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 896
    max_steps_per_rollout_epoch: 896
    use_fixed_reset_state_ids: True
    group_size: ${algorithm.group_size}
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: flashact/so100_sim_pick_place_ring_40
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "${oc.env:POSTVLA_DISTILLED_CKPT}"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 256
  seed: 0
  enable_offload: False

  model:
    model_path: "${oc.env:POSTVLA_DISTILLED_CKPT}"
    model_type: "openpi"
    add_value_head: True
    num_action_chunks: 16
    action_dim: 6
    num_steps: 10
    openpi:
      value_after_vlm: True
      config_name: "pi05_so100_sim"
      num_images_in_input: 2
      noise_method: "flow_noise"
      action_horizon: 16
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      noise_params: [0.16, 0.12, 200]
      num_steps: ${..num_steps}
      joint_logprob: True
    policy_setup: so100_mujoco

  optim:
    lr: 7.91e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
