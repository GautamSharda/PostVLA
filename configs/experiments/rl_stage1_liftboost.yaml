actor:
  model:
    model_type: openpi
    model_path: /network_volume/rlinf_checkpoints/pi05_so100_sim_sft_7999_torch_lorafold_jaxteacher_cubevar20_900_tail2_e3
    precision: null
    num_action_chunks: 16
    action_dim: 6
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 10
    add_value_head: true
    openpi:
      config_name: pi05_so100_sim
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 16
      num_steps: 10
      train_expert_only: true
      action_env_dim: 6
      noise_method: flow_noise
      add_value_head: true
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      use_dsrl: false
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
      action_horizon: 16
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: true
    policy_setup: so100_mujoco
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 80
  seed: 0
  enable_offload: true
  optim:
    lr: 5.0e-07
    value_lr: 0.000155
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
    transport_device: cpu
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: /network_volume/rlinf_runs/so100_ppo_broad_liftboost_lr5e7_kl002_upd1_env8_5_20260629_133404
    project_name: flashact
    experiment_name: so100_ppo_broad_liftboost_lr5e7_kl002_upd1_env8_5
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: 5
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.02
  entropy_bonus: 0.005
  clip_ratio_high: 0.1
  clip_ratio_low: 0.1
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: flashact/so100_sim_pick_place_ring_40
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: /network_volume/rlinf_checkpoints/pi05_so100_sim_sft_7999_torch_lorafold_jaxteacher_cubevar20_900_tail2_e3
    precision: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
