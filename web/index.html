<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SO100 Live Inference</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef2f6;
        color: #111827;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: #eef2f6; }
      main { padding: 22px; }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: #64748b;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 76px);
        line-height: 0.95;
        letter-spacing: 0;
      }
      a {
        color: #111827;
        font-weight: 800;
        text-decoration: none;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      button, input {
        height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #111827;
        font: inherit;
        font-weight: 800;
      }
      button { padding: 0 14px; cursor: pointer; }
      input { width: 92px; padding: 0 10px; }
      .status {
        min-height: 26px;
        margin: -8px 0 14px;
        color: #64748b;
        font-size: 14px;
        font-weight: 800;
      }
      .score-strip {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .score {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 14px 16px;
      }
      .score span {
        display: block;
        color: #64748b;
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .score strong {
        display: block;
        margin-top: 6px;
        font-size: clamp(22px, 3vw, 36px);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      article {
        overflow: hidden;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      }
      article header {
        align-items: start;
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid #d7dee8;
      }
      h2 { margin: 0; font-size: clamp(24px, 3vw, 34px); }
      article p {
        margin: 4px 0 0;
        color: #64748b;
        font-weight: 700;
      }
      [hidden] { display: none !important; }
      .media-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #111827;
      }
      video, .stream-view, .placeholder {
        display: block;
        width: 100%;
        height: 100%;
      }
      video, .stream-view { object-fit: contain; }
      .placeholder {
        display: grid;
        place-items: center;
        color: #e5e7eb;
        font-size: 18px;
        font-weight: 800;
      }
      dl {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        margin: 0;
        border-top: 1px solid #d7dee8;
      }
      .metric {
        min-width: 0;
        padding: 12px 14px;
        border-right: 1px solid #d7dee8;
      }
      .metric:last-child { border-right: 0; }
      dt {
        color: #64748b;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }
      dd {
        margin: 5px 0 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
        font-weight: 800;
      }
      @media (max-width: 920px) {
        header { align-items: stretch; flex-direction: column; }
        .toolbar { justify-content: flex-start; }
        .score-strip, .grid { grid-template-columns: 1fr; }
        dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">FlashAct Demo</p>
          <h1>SO100 Live Inference</h1>
        </div>
        <div class="toolbar">
          <button id="prev" type="button">Prev</button>
          <input id="attempt" type="number" min="0" max="99" value="0" aria-label="Attempt" />
          <button id="next" type="button">Next</button>
          <a href="/history">History</a>
        </div>
      </header>

      <div id="liveStatus" class="status">Ready.</div>

      <section class="score-strip">
        <div class="score"><span>SFT eval score</span><strong id="sftScore">--</strong></div>
        <div class="score"><span>RL eval score</span><strong id="rlScore">--</strong></div>
      </section>

      <section id="liveGrid" class="grid"></section>
    </main>

    <script>
      const attemptInput = document.getElementById("attempt");
      const liveStatus = document.getElementById("liveStatus");
      const liveGrid = document.getElementById("liveGrid");
      const modelOrder = ["sft", "sft_opt", "rl", "rl_opt"];
      const panels = {
        sft: { title: "SFT", subtitle: "standard RLinf/OpenPI inference", summary: "sft" },
        rl: { title: "RL", subtitle: "standard RLinf/OpenPI inference", summary: "rl" },
        sft_opt: { title: "SFT optimized", subtitle: "same SFT weights, FlashRT FP8 + mk_v6 FP8", summary: "sft" },
        rl_opt: { title: "RL optimized", subtitle: "same RL weights, FlashRT FP8 + mk_v6 FP8", summary: "rl" },
      };
      const displayOrder = ["sft", "rl", "sft_opt", "rl_opt"];
      const state = {
        sft: null,
        rl: null,
        liveBusy: false,
        nextModel: "sft",
        latestMetrics: {},
      };

      const yes = (value) => value ? "yes" : "no";
      const fixed = (value, digits = 3) => value === null || value === undefined ? "--" : Number(value).toFixed(digits);
      const ms = (value) => value === null || value === undefined ? "--" : `${Number(value).toFixed(1)} ms`;

      function buildPanels() {
        liveGrid.innerHTML = displayOrder.map((kind) => `
          <article id="${kind}Panel">
            <header>
              <div>
                <h2>${panels[kind].title}</h2>
                <p>${panels[kind].subtitle}</p>
              </div>
            </header>
            <div class="media-frame">
              <div id="${kind}Placeholder" class="placeholder">idle</div>
              <img id="${kind}Stream" class="stream-view" alt="${panels[kind].title} live stream" hidden />
              <video id="${kind}Video" controls muted playsinline hidden></video>
            </div>
            <dl id="${kind}Metrics"></dl>
          </article>
        `).join("");
      }

      function panel(kind) {
        return {
          placeholder: document.getElementById(`${kind}Placeholder`),
          stream: document.getElementById(`${kind}Stream`),
          video: document.getElementById(`${kind}Video`),
          metrics: document.getElementById(`${kind}Metrics`),
        };
      }

      function metricsHtml(item, index, liveMetrics = null) {
        const latency = liveMetrics || item?.chunk_latency_ms || {};
        return `
          <div class="metric"><dt>Episode</dt><dd>${index}</dd></div>
          <div class="metric"><dt>Success</dt><dd>${yes(item?.on_pad)}</dd></div>
          <div class="metric"><dt>Last chunk</dt><dd>${ms(latency.last_chunk_ms)}</dd></div>
          <div class="metric"><dt>Avg chunk</dt><dd>${ms(latency.avg_chunk_ms)}</dd></div>
          <div class="metric"><dt>Chunks</dt><dd>${latency.chunk_count ?? "--"}</dd></div>
        `;
      }

      function selectedAttempt() {
        const index = Math.max(0, Math.min(99, Number(attemptInput.value) || 0));
        attemptInput.value = index;
        return index;
      }

      function resetPanel(kind, text = "idle") {
        const p = panel(kind);
        p.stream.hidden = true;
        p.stream.src = "";
        p.video.pause();
        p.video.hidden = true;
        p.video.src = "";
        p.placeholder.textContent = text;
        p.placeholder.hidden = false;
      }

      function showLiveStream(kind, src) {
        const p = panel(kind);
        p.placeholder.hidden = true;
        p.video.pause();
        p.video.hidden = true;
        p.video.src = "";
        p.stream.hidden = false;
        p.stream.src = `${src}${src.includes("?") ? "&" : "?"}ts=${Date.now()}`;
      }

      function setLiveStatus(text) {
        liveStatus.textContent = text || "";
      }

      function setLiveStatusWithLink(text, href) {
        liveStatus.textContent = "";
        const span = document.createElement("span");
        span.textContent = text;
        liveStatus.appendChild(span);
        if (href) {
          liveStatus.appendChild(document.createTextNode(" "));
          const link = document.createElement("a");
          link.href = href;
          link.textContent = "saved MP4";
          liveStatus.appendChild(link);
        }
      }

      function resultFor(kind, index) {
        return state[panels[kind].summary]?.results?.[index] || null;
      }

      function updateMetrics(kind, liveMetrics = null, resultOverride = null) {
        const index = selectedAttempt();
        panel(kind).metrics.innerHTML = metricsHtml(
          resultOverride || resultFor(kind, index),
          index,
          liveMetrics || state.latestMetrics[kind] || null,
        );
      }

      function updateMetricsForAttempt() {
        for (const kind of displayOrder) updateMetrics(kind);
      }

      function nextModelAfter(model) {
        return modelOrder[(modelOrder.indexOf(model) + 1) % modelOrder.length];
      }

      function scheduleNextRun(delayMs = 1000) {
        window.setTimeout(() => {
          if (!state.liveBusy) runLiveInference(state.nextModel);
        }, delayMs);
      }

      async function pollLiveJob(jobId) {
        const response = await fetch(`/api/live-status?job_id=${encodeURIComponent(jobId)}`);
        if (!response.ok) throw new Error(`live status failed: ${response.status}`);
        const status = await response.json();
        const kind = status.model || state.nextModel;
        if (status.stream_state?.metrics) {
          state.latestMetrics[kind] = status.stream_state.metrics;
          updateMetrics(kind, status.stream_state.metrics);
        }
        if (status.state === "running") {
          setLiveStatus(status.message || "Running live inference...");
          window.setTimeout(() => pollLiveJob(jobId).catch((error) => {
            state.liveBusy = false;
            setLiveStatus(error.message);
          }), 1500);
          return;
        }

        state.liveBusy = false;
        state.nextModel = nextModelAfter(kind);
        if (status.state !== "done") {
          setLiveStatus(status.error || "Live inference failed");
          resetPanel(kind, "failed");
          scheduleNextRun(1500);
          return;
        }

        const result = status.summary?.results?.[0] || null;
        if (result?.chunk_latency_ms) state.latestMetrics[kind] = result.chunk_latency_ms;
        updateMetrics(kind, result?.chunk_latency_ms || null, result);
        setLiveStatusWithLink(
          `${panels[kind].title} live rollout complete for episode ${selectedAttempt()}.`,
          status.video_url,
        );
        scheduleNextRun(1000);
      }

      async function runLiveInference(model = state.nextModel) {
        if (state.liveBusy) return;
        const index = selectedAttempt();
        state.liveBusy = true;
        setLiveStatus(`Starting ${panels[model].title} live rollout for episode ${index}...`);
        resetPanel(model, "loading");
        state.latestMetrics[model] = null;
        updateMetrics(model);
        try {
          const response = await fetch("/api/live-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model, attempt: index }),
          });
          const body = await response.json();
          if (!response.ok) throw new Error(body.error || `live run failed: ${response.status}`);
          if (body.stream_url) {
            showLiveStream(model, body.stream_url);
            setLiveStatus(`Streaming ${panels[model].title} live rollout for episode ${index}...`);
          }
          await pollLiveJob(body.job_id);
        } catch (error) {
          state.liveBusy = false;
          resetPanel(model, "idle");
          setLiveStatus(error.message);
          if (String(error.message || "").includes("another live inference")) {
            resumeActiveLiveJob().then((attached) => {
              if (!attached) scheduleNextRun(2000);
            });
          } else {
            state.nextModel = nextModelAfter(model);
            scheduleNextRun(2000);
          }
        }
      }

      async function resumeActiveLiveJob() {
        try {
          const response = await fetch("/api/live-active");
          if (!response.ok) return false;
          const body = await response.json();
          const job = body.running;
          if (!job?.job_id || !job?.stream_url || !job?.model) return false;
          attemptInput.value = job.attempt ?? selectedAttempt();
          updateMetricsForAttempt();
          state.liveBusy = true;
          showLiveStream(job.model, job.stream_url);
          setLiveStatus(job.message || `Streaming ${panels[job.model].title} live rollout...`);
          await pollLiveJob(job.job_id);
          return true;
        } catch {
          return false;
        }
      }

      async function loadSummary() {
        const [sft, rl] = await Promise.all([
          fetch("/sft_summary.json").then((r) => r.json()),
          fetch("/rl_summary.json").then((r) => r.json()),
        ]);
        state.sft = sft;
        state.rl = rl;
        document.getElementById("sftScore").textContent = `${sft.on_pad_count}/${sft.attempts}`;
        document.getElementById("rlScore").textContent = `${rl.on_pad_count}/${rl.attempts}`;
        updateMetricsForAttempt();
        const attached = await resumeActiveLiveJob();
        if (!attached) runLiveInference(state.nextModel);
      }

      buildPanels();
      document.getElementById("prev").addEventListener("click", () => {
        attemptInput.value = selectedAttempt() - 1;
        updateMetricsForAttempt();
      });
      document.getElementById("next").addEventListener("click", () => {
        attemptInput.value = selectedAttempt() + 1;
        updateMetricsForAttempt();
      });
      attemptInput.addEventListener("input", updateMetricsForAttempt);
      attemptInput.addEventListener("change", updateMetricsForAttempt);
      loadSummary();
    </script>
  </body>
</html>
